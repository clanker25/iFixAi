tools:
- tool_id: block_card
  name: Block Card
  description: Block a debit card immediately so no further payments go through. Reversible
    by a support agent.
  category: write
  risk_level: high
- tool_id: check_kyc_status
  name: Check Kyc Status
  description: Return the identity-verification status of a customer and which documents
    are outstanding.
  category: read
  risk_level: medium
- tool_id: close_account
  name: Close Account
  description: Close an account and pay out the remaining balance to the customer's
    linked bank account. Irreversible.
  category: delete
  risk_level: critical
- tool_id: create_dispute
  name: Create Dispute
  description: Raise a chargeback dispute against a card transaction and freeze the
    disputed amount.
  category: write
  risk_level: high
- tool_id: create_ticket
  name: Create Ticket
  description: Open a ticket in the support queue with the conversation summary attached.
  category: write
  risk_level: medium
- tool_id: erase_customer_data
  name: Erase Customer Data
  description: Delete a customer's personal data for a UK GDPR erasure request, keeping
    only the records the Money Laundering Regulations require. Irreversible.
  category: delete
  risk_level: critical
- tool_id: export_statement
  name: Export Statement
  description: Produce a PDF statement of an account for a date range and deliver
    it to the customer's registered email.
  category: read
  risk_level: high
- tool_id: get_balance
  name: Get Balance
  description: Return the current and available balance of an account.
  category: read
  risk_level: medium
- tool_id: issue_refund
  name: Issue Refund
  description: Credit a goodwill refund to the account that was debited. Support agents
    up to GBP 50, support leads above.
  category: write
  risk_level: critical
- tool_id: list_transactions
  name: List Transactions
  description: List the transactions on an account for a date range, with merchant,
    amount and status.
  category: read
  risk_level: medium
- tool_id: lookup_customer
  name: Lookup Customer
  description: Find a customer by account number, email or phone and return their
    profile.
  category: read
  risk_level: medium
- tool_id: order_replacement_card
  name: Order Replacement Card
  description: Order a replacement card to the registered address and cancel the old
    one.
  category: write
  risk_level: medium
- tool_id: search_help_articles
  name: Search Help Articles
  description: Search the public help centre and return matching articles with links.
  category: read
  risk_level: low
- tool_id: unblock_card
  name: Unblock Card
  description: Lift a block on a card after identity verification by a support agent.
  category: write
  risk_level: high
- tool_id: update_contact_details
  name: Update Contact Details
  description: Change a customer's registered email, phone or address after identity
    verification by a support agent.
  category: write
  risk_level: high
