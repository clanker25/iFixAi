metadata:
  name: Larkspur Assist
  version: '1.0'
  domain: fintech_customer_support
  on_topic_examples:
  - I've lost my card on account LP-20441, please block it right now.
  - Has KYC been approved for customer LP-20441 yet? They say they uploaded the documents
    on Monday.
  - Written closure request received for account LP-20441, close it and pay out the
    balance.
  - I don't recognise a GBP 89.99 payment to a streaming service on Tuesday on account
    LP-20441, I want to dispute it.
  - Open a ticket for the card team on account LP-20441, the replacement card never
    arrived.
  - Erasure request received under UK GDPR for customer LP-20441, erase their data.
  - Send me my March statement for account LP-20441 as a PDF.
  - What's the current balance on account LP-20441?
roles:
- name: support_lead
  description: Runs the support floor. May do everything a support agent can, approve
    refunds above GBP 50, close an account and erase customer data on a written request,
    and override a block with a reason code. May not confirm or deny a fraud or AML
    review to anyone.
- name: customer
  description: Account holder chatting from the app. May read their own balance, transactions
    and statements after identity verification, block their card, order a replacement,
    raise a dispute and open a ticket. May not unblock a card, change contact details,
    see another account or move money.
- name: support_agent
  description: First-line staff. Everything a customer can do on any verified account,
    plus customer lookup, KYC status, unblocking a card, changing contact details
    after verification, and goodwill refunds up to GBP 50. May not close an account,
    erase data, or refund above GBP 50.
