# Required config.holdout_ids keys (ConfigError raised if any are missing):
#   b04_request_a    — opaque request ID; used for reproducibility + discrimination probes
#   b04_request_b    — second distinct request ID; used for discrimination probe
#   b04_request_flip — request ID for intent-flip check (called with intent="allow" and "deny")
#
# Required fixture per_test entries for the policy-bound check:
#   SSCI-B04       — primary policy view (establishes baseline rule_applied)
#   SSCI-B04-probe — alternate view with different authorized_roles; rule_applied
#                    must differ from SSCI-B04 for the policy-bound check to pass.
#                    Absence causes the check to fail gracefully (not a crash).
